[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cheragh"
version = "1.4.0"
description = "Composable RAG toolkit for standard Python applications"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "RAG Toolkit Maintainers" }]
keywords = ["rag", "retrieval", "llm", "embeddings", "information-retrieval"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = ["numpy>=1.24,<3", "pydantic>=2,<3"]

[project.urls]
Homepage = "https://github.com/Ai-Cyr/Cheragh"
Documentation = "https://github.com/Ai-Cyr/Cheragh/tree/main/docs"
Issues = "https://github.com/Ai-Cyr/Cheragh/issues"
Repository = "https://github.com/Ai-Cyr/Cheragh"

[project.optional-dependencies]
local = ["sentence-transformers>=2.2,<6"]
openai = ["openai>=1.0,<4"]
cohere = ["cohere>=5.0,<8"]
voyage = ["voyageai>=0.2,<1"]
anthropic = ["anthropic>=0.25,<2"]
litellm = ["litellm>=1.0,<2"]
rerank = ["sentence-transformers>=2.2,<6"]
learned-retrieval = ["sentence-transformers>=5.0,<6"]
multimodal = ["sentence-transformers>=2.2,<6", "Pillow>=10.0,<13"]
colpali = ["colpali-engine>=0.3,<1", "Pillow>=10.0,<13"]
raptor = ["scikit-learn>=1.0,<2"]
bm25 = ["rank-bm25>=0.2.2,<1"]
config = ["PyYAML>=6.0,<7", "pydantic>=2,<3"]
pdf = ["pypdf>=4.0,<7"]
docx = ["python-docx>=1.0,<2"]
faiss = ["faiss-cpu>=1.7,<2"]
chroma = ["chromadb>=0.5,<2"]
qdrant = ["qdrant-client>=1.9,<2"]
fastapi = ["fastapi>=0.110,<1", "uvicorn>=0.29,<1", "pydantic>=2,<3"]
redis = ["redis>=5.0,<9"]
dev = [
  "pytest>=7,<10",
  "pytest-cov>=4,<8",
  "ruff>=0.11,<1",
  "mypy>=1.10,<3",
  "build>=1.5,<2",
  "twine>=7,<8",
  "PyYAML>=6.0,<7",
  "httpx>=0.27,<1",
  "tomli>=2,<3; python_version < '3.11'",
]
all = [
  "sentence-transformers>=5.0,<6",
  "Pillow>=10.0,<13",
  "openai>=1.0,<4",
  "cohere>=5.0,<8",
  "voyageai>=0.2,<1",
  "anthropic>=0.25,<2",
  "litellm>=1.0,<2",
  "scikit-learn>=1.0,<2",
  "rank-bm25>=0.2.2,<1",
  "PyYAML>=6.0,<7",
  "pydantic>=2,<3",
  "pypdf>=4.0,<7",
  "python-docx>=1.0,<2",
  "faiss-cpu>=1.7,<2",
  "chromadb>=0.5,<2",
  "qdrant-client>=1.9,<2",
  "fastapi>=0.110,<1",
  "uvicorn>=0.29,<1",
  "redis>=5.0,<9",
]

[project.scripts]
cheragh = "cheragh.cli.main:cli_entrypoint"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cheragh = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
ignore_missing_imports = true
follow_imports = "silent"
files = [
  "src/cheragh/adaptive.py",
  "src/cheragh/agentic",
  "src/cheragh/catalog",
  "src/cheragh/community_graph",
  "src/cheragh/context_packing.py",
  "src/cheragh/corrective",
  "src/cheragh/evaluation/claims.py",
  "src/cheragh/flare.py",
  "src/cheragh/multihop",
  "src/cheragh/multimodal",
  "src/cheragh/raptor_engine",
  "src/cheragh/retrieval/learned.py",
  "src/cheragh/self_rag",
  "src/cheragh/temporal",
  "src/cheragh/training",
]

[[tool.mypy.overrides]]
module = "cheragh.engine"
disable_error_code = ["assignment"]

[[tool.mypy.overrides]]
module = "cheragh.vectorstores.*"
follow_imports = "skip"
