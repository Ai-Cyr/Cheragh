name: tests

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  FORCE_COLOR: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  quality:
    name: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install quality tools
        run: |
          python -m pip install "pip==26.2.1"
          python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Type check
        run: mypy --no-incremental

  test:
    name: tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package and test tools
        run: |
          python -m pip install "pip==26.2.1"
          python -m pip install -e ".[dev,fastapi]"
          python -m pip check
      - name: Run tests
        run: pytest --cov=cheragh --cov-report=term-missing

  package:
    name: package artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Build distributions
        run: |
          python -m pip install "pip==26.2.1" "build==1.5.0" "twine==7.0.0"
          python -m build
          python -m twine check dist/*
      - name: Smoke-test wheel
        run: |
          python -m venv wheel-smoke
          wheel-smoke/bin/python -m pip install "pip==26.2.1"
          wheel-smoke/bin/python -m pip install --only-binary=:all: dist/*.whl
          wheel-smoke/bin/python -m pip check
          wheel-smoke/bin/python -c "import cheragh; print(cheragh.__version__)"
          wheel-smoke/bin/cheragh --help
      - name: Smoke-test source distribution
        run: |
          python -m venv sdist-smoke
          sdist-smoke/bin/python -m pip install "pip==26.2.1"
          sdist-smoke/bin/python -m pip install dist/*.tar.gz
          sdist-smoke/bin/python -m pip check
          sdist-smoke/bin/python -c "import cheragh; print(cheragh.__version__)"

  container:
    name: container image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build runtime image
        run: docker build --pull --tag cheragh:ci .
      - name: Verify runtime image
        run: |
          test "$(docker image inspect cheragh:ci --format '{{.Config.User}}')" = "10001:10001"
          docker run --rm --entrypoint python cheragh:ci -c \
            "import cheragh; from pathlib import Path; assert not Path('/app/src').exists(); print(cheragh.__version__)"
          docker run --rm --entrypoint cheragh cheragh:ci --help
          CHERAGH_API_KEY=ci-only docker compose config --quiet

  research-backends:
    name: research backends (CPU)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install real research backends
        run: |
          python -m pip install "pip==26.2.1"
          python -m pip install "torch>=2.2,<3" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev,fastapi,raptor,graphrag,training]"
          python -m pip check
          python -c "import torch, umap, graspologic; print(torch.__version__, umap.__version__, graspologic.__version__)"
      - name: Exercise research algorithms without model downloads
        env:
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          NUMBA_NUM_THREADS: "1"
        run: pytest -q tests/test_v150_*.py

  dependency-audit:
    name: dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Audit core dependencies
        run: |
          python -m pip install "pip==26.2.1" "pip-audit==2.10.1"
          python -m pip_audit --strict --progress-spinner=off .
