name: tests

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  FORCE_COLOR: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  quality:
    name: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install quality tools
        run: |
          python -m pip install "pip==26.2.1"
          python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests scripts
      - name: Type check
        run: mypy --no-incremental

  test:
    name: tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package and test tools
        run: |
          python -m pip install "pip==26.2.1"
          python -m pip install -e ".[dev,fastapi]"
          python -m pip check
      - name: Run tests
        run: pytest --cov=cheragh --cov-report=term-missing

  package:
    name: package artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Build distributions
        run: |
          python -m pip install "pip==26.2.1" "build==1.5.0" "twine==7.0.0"
          python -m build
          python -m twine check dist/*.whl dist/*.tar.gz
      - name: Smoke-test wheel
        run: |
          python -m venv wheel-smoke
          wheel-smoke/bin/python -m pip install "pip==26.2.1"
          wheel-smoke/bin/python -m pip install --only-binary=:all: dist/*.whl
          wheel-smoke/bin/python -m pip check
          wheel-smoke/bin/python -I scripts/smoke_distribution.py
      - name: Smoke-test source distribution
        run: |
          python -m venv sdist-smoke
          sdist-smoke/bin/python -m pip install "pip==26.2.1"
          sdist-smoke/bin/python -m pip install dist/*.tar.gz
          sdist-smoke/bin/python -m pip check
          sdist-smoke/bin/python -I scripts/smoke_distribution.py
          sdist_dir="$(mktemp -d)"
          tar --extract --gzip --file dist/*.tar.gz --strip-components=1 --directory "$sdist_dir"
          sdist-smoke/bin/python -I -m unittest discover \
            --start-directory "$sdist_dir/tests" --pattern test_production_delivery.py
      - name: Preserve validated distributions
        run: |
          cd dist
          sha256sum *.whl *.tar.gz > SHA256SUMS
      - name: Upload validated distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cheragh-dist-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  container:
    name: container image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build runtime image
        run: docker build --pull --tag cheragh:ci .
      - name: Verify runtime image
        run: |
          test "$(docker image inspect cheragh:ci --format '{{.Config.User}}')" = "10001:10001"
          docker run --rm --entrypoint python cheragh:ci -c \
            "import cheragh; from pathlib import Path; assert not Path('/app/src').exists(); print(cheragh.__version__)"
          docker run --rm --entrypoint cheragh cheragh:ci --help
          CHERAGH_API_KEY=ci-only docker compose config --quiet
      - name: Smoke-test hardened HTTP container
        env:
          CHERAGH_API_KEY: ci-smoke-key
        run: |
          data_dir="$(mktemp -d "${RUNNER_TEMP}/cheragh-data.XXXXXX")"
          printf '%s\n' 'The production release identifier is amber-lighthouse.' > "$data_dir/corpus.txt"
          docker run --rm --user 0:0 \
            --mount "type=bind,src=${data_dir},dst=/data" \
            --entrypoint chown cheragh:ci 10001:10001 /data
          docker run --rm \
            --mount "type=bind,src=${data_dir},dst=/data" \
            --entrypoint cheragh cheragh:ci \
            index /data/corpus.txt --output /data/.cheragh_index
          container="cheragh-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trap 'docker logs "$container"; docker rm --force "$container"' EXIT
          docker run --detach --name "$container" --init \
            --publish 127.0.0.1::8000 --env CHERAGH_API_KEY \
            --mount "type=bind,src=${data_dir},dst=/data,readonly" \
            --read-only --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --cap-drop ALL --security-opt no-new-privileges \
            --pids-limit 256 --memory 2g --cpus 2 cheragh:ci
          address="$(docker port "$container" 8000/tcp)"
          python3 -I scripts/smoke_server.py "http://${address}"
          docker stop --time 10 "$container"
          exit_code="$(docker inspect --format '{{.State.ExitCode}}' "$container")"
          # Uvicorn re-raises SIGTERM after its graceful shutdown (128 + 15).
          test "$exit_code" = "0" || test "$exit_code" = "143"
          shutdown_logs="$(docker logs "$container" 2>&1)"
          [[ "$shutdown_logs" == *"Application shutdown complete."* ]]

  research-backends:
    name: research backends (CPU)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install real research backends
        run: |
          python -m pip install "pip==26.2.1"
          python -m pip install "torch>=2.6,<3" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev,fastapi,raptor,graphrag,training,research]"
          python -m pip check
          python -c "import torch, umap, graspologic; print(torch.__version__, umap.__version__, graspologic.__version__)"
      - name: Exercise research algorithms without model downloads
        env:
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          NUMBA_NUM_THREADS: "1"
        run: pytest -q

  dependency-audit:
    name: dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Audit core and deployed server dependencies
        run: |
          python -m pip install "pip==26.2.1" "pip-audit==2.10.1"
          python -m pip_audit --strict --progress-spinner=off .
          python -m venv server-audit
          server-audit/bin/python -m pip install "pip==26.2.1"
          server-audit/bin/python -m pip install --constraint docker/constraints.txt ".[fastapi,config]"
          server-audit/bin/python -m pip check
          server-audit/bin/python -m pip freeze --exclude cheragh > server-requirements.txt
          python -m pip_audit --strict --progress-spinner=off \
            --disable-pip --no-deps -r server-requirements.txt
