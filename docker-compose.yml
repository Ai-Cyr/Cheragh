services:
  cheragh:
    build:
      context: .
      args:
        PYTHON_IMAGE: python:3.12.14-slim-bookworm
        CHERAGH_EXTRAS: fastapi,config
    init: true
    restart: unless-stopped
    read_only: true
    user: "10001:10001"
    ports:
      - "127.0.0.1:${CHERAGH_PORT:-8000}:8000"
    volumes:
      - ./data:/data:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 2g
    cpus: "2.0"
    environment:
      CHERAGH_API_KEY: ${CHERAGH_API_KEY:?CHERAGH_API_KEY must be set}
      CHERAGH_INDEX: /data/.cheragh_index
      CHERAGH_INDEX_ROOT: /data
      CHERAGH_ENABLE_INDEXING: "false"
      CHERAGH_REQUIRE_AUTH: "true"
    stop_grace_period: 30s
